name: Bug report
description: A published API returns a wrong result, throws unexpectedly, or fails to load.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report behavior that is wrong for the code, not a value that is merely out of
        date in the bundled data — use **Data correction** for that.

        Remove commander names, account identifiers, local paths and other personal
        details from every capture you paste here.
  - type: dropdown
    id: implementation
    attributes:
      label: Package
      description:
        Which package shows the bug? Both packages prove the same behavior against the
        shared fixtures, so a wrong result in one is worth checking in the other.
      options:
        - TypeScript — @elite-dangerous-almanac/core
        - .NET — EliteDangerousAlmanac
        - Both
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Feature area
      description:
        Which area does the bug come from? Each one names its TypeScript subpath and
        its .NET namespace.
      options:
        - astro / Astronomy
        - ships / Ships
        - equipment / Equipment
        - i18n / Localization
        - materials / Materials
        - commodities / Commodities
        - Package build, exports, subpaths or namespaces
        - Not sure
    validations:
      required: true
  - type: input
    id: entry-point
    attributes:
      label: Entry point
      description: The exact symbol involved, with the subpath or the namespace that holds it.
      placeholder:
        "@elite-dangerous-almanac/core/astro/procedural-system — ProceduralSystem.fromName, or
        EliteDangerousAlmanac.Astronomy — ProceduralSystem.FromName"
    validations:
      required: true
  - type: textarea
    id: reproduction-typescript
    attributes:
      label: Minimal reproduction — TypeScript
      description:
        The smallest input that reproduces the bug, as runnable code. Fill in this field or
        the C# one below; a report needs one of them. It is attached as TypeScript, so no
        backticks are needed.
      render: typescript
      placeholder: |
        import { ProceduralSystem } from "@elite-dangerous-almanac/core/astro/procedural-system";

        ProceduralSystem.fromName("Synuefe EN-H d11-96")?.systemAddress;
  - type: textarea
    id: reproduction-csharp
    attributes:
      label: Minimal reproduction — C#
      description:
        The same, for the .NET package. It is attached as C#, so no backticks are
        needed.
      render: csharp
      placeholder: |
        using EliteDangerousAlmanac.Astronomy;

        ulong? address = ProceduralSystem.FromName("Synuefe EN-H d11-96")?.SystemAddress;
  - type: textarea
    id: observed
    attributes:
      label: Observed result
      description: What happened, including the full error and stack trace if one was thrown.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description:
        What you expected instead, and what that expectation is based on — documented
        behavior, in-game observation or an upstream source.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version or commit
      description:
        The `@elite-dangerous-almanac/core` or `EliteDangerousAlmanac` version, or the commit
        if you build from source.
      placeholder: "0.2.0, or commit 4be0133"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Runtime
      description:
        For TypeScript, the Node.js version, or the browser and bundler. For .NET, the target
        framework and the runtime that runs it.
      placeholder: "Node.js 22.11.0 / Vite 5 + Chrome 130, or .NET 10 on Windows 11"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched open and closed issues for this gap.
          required: true
        - label:
            The reproduction and any pasted output contain no commander names, account
            identifiers or other private data.
          required: true
