name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Generate API documentation
        run: npm run docs

      - name: Test with coverage thresholds
        run: npm test

      - name: Build package
        run: npm run build

      - name: Test package entry points
        run: npm run test:package

      - name: Setup minimum supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Test package on minimum supported Node.js
        run: npm run test:package
