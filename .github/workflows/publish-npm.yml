name: Publish npm Package

on:
  push:
    tags: ["v*"]

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Check and pack npm package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      tarball-sha256: ${{ steps.pack.outputs.tarball-sha256 }}
      version: ${{ steps.package.outputs.version }}
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify package version
        id: package
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match manifest v$version"
            exit 1
          fi
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::release version $version is not a stable SemVer"
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"
          latest=$(npm view @elite-dangerous-almanac/core version)
          node - "$version" "$latest" <<'NODE'
          const [version, latest] = process.argv.slice(2);
          const stable = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
          if (!stable.test(latest)) {
              console.error(`::error::npm latest ${latest} is not a stable SemVer`);
              process.exit(1);
          }
          const candidate = version.split('.').map(Number);
          const current = latest.split('.').map(Number);
          const comparison = candidate.findIndex((part, index) => part !== current[index]);
          if (comparison < 0 || candidate[comparison] <= current[comparison]) {
              console.error(`::error::release version ${version} is not newer than npm latest ${latest}`);
              process.exit(1);
          }
          NODE
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Install the packing npm client
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0 --ignore-scripts
          test "$(npm --version)" = 11.19.0

      - name: Enable Corepack
        run: corepack enable pnpm

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >>"$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('typescript/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm run audit

      # This job deliberately has no id-token permission while installed dependencies run.
      - name: Check, build and verify the package
        run: pnpm run check && pnpm run build && pnpm run test:package

      - name: Pack for publishing
        id: pack
        env:
          EXPECTED_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          tarball=$(npm pack --ignore-scripts)
          test -f "$tarball"
          echo "tarball=$tarball" >>"$GITHUB_OUTPUT"
          echo "tarball-sha256=$(sha256sum "$tarball" | cut -d ' ' -f 1)" >>"$GITHUB_OUTPUT"
          packed_version=$(tar -xOf "$tarball" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
          if [ "$packed_version" != "$EXPECTED_VERSION" ]; then
            echo "::error::packed manifest $packed_version does not match $EXPECTED_VERSION"
            exit 1
          fi

      - name: Upload package for the OIDC job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: typescript/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to npm with OIDC
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: npm
      url: https://www.npmjs.com/package/@elite-dangerous-almanac/core
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org

      - name: Download verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: typescript

      - name: Verify package digest
        env:
          TARBALL: ${{ needs.prepare.outputs.tarball }}
          TARBALL_SHA256: ${{ needs.prepare.outputs.tarball-sha256 }}
        run: |
          set -euo pipefail
          [[ "$TARBALL" = *.tgz && "$TARBALL" != */* && "$TARBALL" != .* && "$TARBALL" != -* ]]
          [[ "$TARBALL_SHA256" =~ ^[0-9a-f]{64}$ ]]
          echo "$TARBALL_SHA256  $TARBALL" | sha256sum --check --strict

      - name: Publish
        env:
          TARBALL: ${{ needs.prepare.outputs.tarball }}
        run: >-
          npm publish "./$TARBALL"
          --registry=https://registry.npmjs.org
          --access public
          --tag latest
          --provenance
          --ignore-scripts

  release:
    name: Create GitHub release
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release create "v$VERSION" --verify-tag --title "v$VERSION" --generate-notes
