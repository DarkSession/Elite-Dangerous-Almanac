name: Publish npm Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run the checks and build and pack the tarball, but do not publish it
        type: boolean
        default: true

concurrency:
  group: publish-npm
  cancel-in-progress: false # a publish that is already running must finish

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Not every release in this repository is a release of this package. A tag
    # belonging to a second language implementation has to leave this job
    # unstarted rather than fail it — a red X and a spent `npm` deployment on
    # someone else's release would be this workflow's bug, not theirs.
    if: >-
      github.event_name != 'release'
      || startsWith(github.event.release.tag_name, 'v')
      || startsWith(github.event.release.tag_name, 'typescript-v')
    environment:
      name: npm
      url: https://www.npmjs.com/package/@elite-dangerous-almanac/core
    permissions:
      contents: read
      id-token: write # mints the OIDC token npm signs the provenance attestation with
    defaults:
      run:
        working-directory: typescript
    env:
      # Every guard below asks the same question — is this run going to take a
      # version number? A release always is; a manual run only when its dry-run
      # input was unticked. Decided once, so no two steps can disagree about it.
      #
      # Compared as text on purpose: the input is a real boolean when the button
      # is clicked, but a string when the run comes from the API or `gh workflow
      # run`, and `!inputs.dry-run` reads every non-empty string as "not a dry
      # run" — including the string `true`.
      REAL_PUBLISH: ${{ github.event_name == 'release' || format('{0}', inputs.dry-run) != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org # writes the .npmrc that reads NODE_AUTH_TOKEN
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve what to publish
        id: package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')

          # A release event names its tag directly; a manual run has to be sitting
          # on one. Nothing takes a version number off a branch: a real publish is
          # permanent and has to be reproducible from a ref that cannot move.
          tag=$RELEASE_TAG
          if [ -z "$tag" ] && [ "$REF_TYPE" = tag ]; then
            tag=$REF_NAME
          fi
          if [ "$REAL_PUBLISH" = true ] && [ -z "$tag" ]; then
            echo "::error::a real publish must run from a tag, not from $REF_TYPE $REF_NAME"
            exit 1
          fi

          # The tag and the manifest have to agree, or the GitHub release and the
          # npm version drift apart and neither one tells you what shipped. Both
          # `v1.2.3` and `typescript-v1.2.3` name version 1.2.3; the prefixed form
          # is there for the day a second language implementation releases too.
          if [ -n "$tag" ]; then
            tagged=${tag#typescript-}
            tagged=${tagged#v}
            if [ "$tagged" != "$version" ]; then
              echo "::error::tag $tag does not name typescript/package.json version $version"
              exit 1
            fi
          fi

          # A prerelease must never become the version `npm install` picks by
          # default, so anything carrying a SemVer prerelease suffix goes to
          # `next`. Build metadata is dropped first: `1.2.3+build.7` has a hyphen
          # nowhere near a prerelease, and `1.2.3-rc.1+build.7` has both.
          case "${version%%+*}" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac

          {
            echo "name=$name"
            echo "version=$version"
            echo "dist-tag=$dist_tag"
          } >>"$GITHUB_OUTPUT"

          echo "$name@$version -> dist-tag $dist_tag" >>"$GITHUB_STEP_SUMMARY"

      # This runs before the registry lookup below, because that lookup wants the
      # real token: `setup-node` writes an `.npmrc` reading `NODE_AUTH_TOKEN` and
      # exports a placeholder value, so an npm command that does not pass the
      # secret talks to the registry as nobody in particular.
      - name: Check the npm token is configured
        if: env.REAL_PUBLISH == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::secret NPM_TOKEN is not set on the npm environment — add an npm automation token"
            exit 1
          fi

      - name: Check the version is still unpublished
        if: env.REAL_PUBLISH == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          SPEC: ${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail

          # npm versions are immutable, so a repeat publish fails after a full
          # build rather than at the start. A registry that cannot be asked is
          # not the same answer as a version that is free, so the two are told
          # apart: only npm's own "no such package or version" is a pass.
          #
          # `--json` puts everything needed on stdout — the version when there is
          # one, an error object when there is not — so stderr is discarded
          # rather than merged, and a warning npm happens to print cannot read as
          # a version that already exists.
          if answer=$(npm view --json "$SPEC" version 2>/dev/null); then
            if [ -n "$answer" ] && [ "$answer" != null ]; then
              echo "::error::$SPEC is already on the registry — bump the version in typescript/package.json"
              exit 1
            fi
          else
            case "$answer" in
              *'"E404"'*) : ;; # the expected answer for a version that is still free
              *)
                echo "::error::could not ask the registry about $SPEC: $answer"
                exit 1
                ;;
            esac
          fi

      - name: Audit dependencies
        run: npm run audit

      # Deliberately its own step, with no token in the environment. These scripts
      # run ESLint, tsc, the test suite and esbuild, so every devDependency in the
      # tree gets to execute here — and none of them should be doing so alongside
      # a credential that can publish to the scope. That is also why the publish
      # step below passes `--ignore-scripts`: `prepublishOnly` would otherwise run
      # this same work again, that time with the token exported.
      - name: Check, build and verify the package
        run: npm run check && npm run build && npm run test:package

      - name: Publish
        if: env.REAL_PUBLISH == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.package.outputs.dist-tag }}
        # `--access public` because the package is scoped and scoped packages
        # default to restricted; `--provenance` links the tarball to this commit
        # and this workflow run, which npm shows as a verified badge. Packing is
        # `--ignore-scripts` on purpose — see the step above — so `dist/` and the
        # generated legal files come from the build that just ran. A `prepack` or
        # `prepare` script added to the package later would need adding there too.
        run: npm publish --access public --tag "$DIST_TAG" --provenance --ignore-scripts

      - name: Pack without publishing
        if: env.REAL_PUBLISH != 'true'
        env:
          DIST_TAG: ${{ steps.package.outputs.dist-tag }}
        # No token: a dry run never authenticates. It also never exercises
        # provenance — npm only generates an attestation on a real publish — so
        # this rehearses the checks, the build and the tarball contents, and
        # nothing about the upload.
        run: npm publish --access public --tag "$DIST_TAG" --dry-run --ignore-scripts
