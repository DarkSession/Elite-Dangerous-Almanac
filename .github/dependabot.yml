version: 2
updates:
  - package-ecosystem: npm # also covers pnpm-lock.yaml
    directory: /typescript
    schedule:
      interval: weekly
    # A release has to be seven days old before Dependabot will offer it, which is
    # the same window `minimumReleaseAge` in typescript/pnpm-workspace.yaml applies
    # to resolution. Without it, a pull request could propose a version that pnpm
    # then refuses to install, and its own CI run would fail on the mismatch.
    #
    # Only this ecosystem sets it. `cooldown` is documented per ecosystem rather
    # than universally, and Dependabot rejects a configuration file as a whole when
    # one entry carries a key that entry does not support — which would stop every
    # update in this file, not just the offending one. The npm entry is the one that
    # has to agree with pnpm; the others have no resolver to disagree with.
    cooldown:
      default-days: 7
    groups:
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 3

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
